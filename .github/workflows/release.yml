name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
    steps:
      # The app's token, so CI runs on the release PR (a GITHUB_TOKEN-made PR starts no workflows).
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write # GitHub Packages
      id-token: write # npmjs trusted publishing and provenance: no npm token is stored
    steps:
      - uses: actions/checkout@v7
      # pnpm, at the version in package.json's packageManager (it publishes with trusted
      # publishing over OIDC itself: no npm upgrade needed).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      # Public users install from npmjs. Turned on by the repository variable NPMJS_TRUSTED once
      # each package's trusted publisher is set on npmjs (the first publish is by hand).
      - name: Publish to npmjs
        if: vars.NPMJS_TRUSTED == 'true'
        # .npmrc maps @runeazy to GitHub Packages, and pnpm publishes a scoped package to its
        # scope's registry whatever --registry says: point the scope itself at npmjs.
        run: pnpm -r publish --no-git-checks --ignore-scripts --access public --provenance --config.@runeazy:registry=https://registry.npmjs.org
      # RunEazy's repositories map @runeazy to GitHub Packages, where the SDK lives until it goes
      # public, so devkit is there too.
      - name: Publish to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/.npmrc"
          pnpm -r publish --no-git-checks --ignore-scripts --registry https://npm.pkg.github.com --userconfig "$RUNNER_TEMP/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
